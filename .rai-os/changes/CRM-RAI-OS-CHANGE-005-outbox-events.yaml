# Пробел: нет outbox/событий — межмодульные изменения не могут быть надёжными и прослеживаемыми
# Схема: RAI_OS/protocol/schemas/change.schema.json
schema_version: 1
id: CRM-RAI-OS-CHANGE-005
module_id: crm-rai
status: proposed
priority: P1
type: event
summary: >
  Модуль не публикует событий и не имеет outbox/inbox: смена стадии, оплата,
  создание сделки/КП существуют только как строки SQLite. Целевая интеграция
  (передача результатов в rai-mi/rai-ep, canon §5 обязательный общий контекст:
  ID сообщения, тенант, действующее лицо, корреляция, идемпотентность, аудит)
  невозможна без событийной шины с outbox. Текущих межмодульных потребителей нет,
  поэтому пробел не ломает работающий standalone-режим, но блокирует работу по
  интеграции с OS.
affects:
  - crm-rai
  - rai-os-integration
contracts: []
decisions:
  - "Целевое: outbox в rai-ep (интеграционная среда платформы); CRM RAI публикует доменные события через адаптер, не создавая собственную шину"
  - "Точные схемы событий утверждаются на вехе «Общие контракты» — преждевременные форматы не создаём (canon §5)"
evidence:
  - app/models.py
  - docs/CRM_RAI_TECH.md

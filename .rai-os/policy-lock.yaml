# RAI OS Policy Lock — CRM RAI
# Схема: RAI_OS/protocol/schemas/policy-lock.schema.json (validate: python scripts/rai_os_validate.py)
# Соответствие не заявляется без завершённых локальных работ и проверок (governance §3).
schema_version: 1
module_id: crm-rai
rai_os_policy: 1.0.0
adopted:
  # declared = канон/политика прочитаны и признаны, внедрения в репо ещё нет.
  system_canon: { version: 1.0.0, status: declared }
  governance: { version: 1.0.0, status: declared }   # процесс внедрён фазой 24; enforcement локальный, OS-сверки ещё не было
  architecture: { version: 1.0.0, status: declared } # donor-and-standalone декларирован; целевые адаптеры платформы не построены
  data_ownership: { version: 1.0.0, status: declared } # владение sales-domain декларировано; конфликтующих владельцев не выявлено
  security: { version: 1.0.0, status: partial }  # role-гейты в UI есть (app/routes/*); объектная авторизация частична (CRM-RAI-OS-CHANGE-002); MCP без auth (CHANGE-003)
  contracts: { version: 1.0.0, status: partial } # есть фактический MCP-интерфейс; версионированного контракта нет (CHANGE-003)
  design: { version: 1.0.0, status: partial }    # Visual Canon соблюдается UI-фазами (фазы 5, 22–23); за пределами UI не применялся
  ai: { version: 1.0.0, status: partial }        # Hermes-интеграция работает; A-RAI control plane нет; MCP-мутации вне авторизации (CHANGE-003)
  delivery: { version: 1.0.0, status: partial }  # docker-деплой на rai-dev работает; CI нет; dev/prod разделение — CHANGE-006
enforcement: declared
# RAI-OS-DECISION-CRM-001 (2026-09-07): W1 активирован Владельцем; W2 активируется
# после свидетельства ротации по DIR-002 (в фазе 25, PLAN T-03)
exceptions: [RAI-OS-WAIVER-001]

  data_ownership: { version: 1.0.0, status: declared } # владение sales-domain декларировано; конфликтующих владельцев не выявлено
  security: { version: 1.0.0, status: partial }  # role-гейты в UI; объектная авторизация частична (CHANGE-002); MCP без auth (CHANGE-003, W1); дефолтный прод-админ ротирован, fail-fast профиля prod внедрён (DIR-002, фаза 25)
  contracts: { version: 1.0.0, status: partial } # есть фактические MCP-интерфейсы (stdio + мост :8100, DRIFT-CRM-001 объявлен); версионированного контракта нет (CHANGE-003)
  design: { version: 1.0.0, status: partial }    # Visual Canon соблюдается UI-фазами (фазы 5, 22–23); за пределами UI не применялся

# Предлагаемое исключение: единая dev/prod конфигурация с dev-дефолтами секретов
# Схема: RAI_OS/protocol/schemas/waiver.schema.json
# Статус proposed — требует одобрения Владельца (governance §4: P0/P1 только Владелец)
schema_version: 1
id: RAI-OS-WAIVER-002
module_id: crm-rai
rule: "Политика delivery/security: профили развёртывания dev/prod разделены; прод не может подняться на dev-дефолтах SECRET_KEY/ADMIN_PASSWORD"
priority: P1
status: proposed
reason: >
  app/config.py содержит dev-дефолты SECRET_KEY и ADMIN_PASSWORD ("admin"), один
  .env обслуживает dev и прод (см. CRM-RAI-OS-CHANGE-006). Реальный прод-инстанс
  использует значения из серверного .env, но защиты от запуска с дефолтами нет.
risk: >
  При ошибке конфигурации прод-инстанс поднимается на предсказуемых креденшалах
  (админ admin/admin) и предсказуемом ключе сессий; локальная dev-копия работает
  с копией прод-БД.
compensating_controls:
  - ".env в .gitignore и не попадает в git (проверено git ls-files); секреты не коммитятся"
  - "Прод-инстанс настроен серверным .env с реальными значениями (docs/CRM_RAI_TECH.md §10)"
  - "Порт 8000 закрыт ufw, наружу только nginx TLS; доступ к /reports,/analytics,/admin ограничен ролями"
  - "Бэкапы БД по регламенту обслуживания (docs/CRM_RAI_TECH.md §11)"
owner: Denis
approved_by: pending
approved_at: "2026-09-06"
expires_at: "2026-10-06"
exit_criteria:
  - "Профили dev/prod разведены, прод-старт с dev-дефолтами невозможен (fail-fast валидация конфигурации) — закрытие CRM-RAI-OS-CHANGE-006"

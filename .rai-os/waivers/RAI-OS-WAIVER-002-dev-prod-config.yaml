# Исключение (ОДОБРЕНО Владельцем по RAI-OS-DECISION-CRM-001 от 2026-09-07; срок сокращён до 2026-09-27)
# АКТИВАЦИЯ (status: active + внесение в policy-lock.exceptions) — только после
# свидетельства ротации по RAI-OS-DIR-002 (повторный boolean re-check).
# OS-мастер-копия: F:\RAI_ALL_OS\waivers\RAI-OS-WAIVER-002.yaml
# Схема: RAI_OS/protocol/schemas/waiver.schema.json
schema_version: 1
id: RAI-OS-WAIVER-002
module_id: crm-rai
rule: "Политика delivery/security: профили развёртывания dev/prod разделены; прод не может подняться на dev-дефолтах SECRET_KEY/ADMIN_PASSWORD"
priority: P1
status: approved
reason: >
  В app/config.py зашиты dev-дефолты SECRET_KEY и ADMIN_PASSWORD; один .env на
  dev и прод; защиты от старта прод-инстанса на дефолтах нет. Проверка 2026-09-07:
  SECRET_KEY переопределён (true), ADMIN_PASSWORD — нет (false), активный
  prod-админ на дефолтном пароле (см. RAI-OS-DIR-002, P0).
risk: >
  Предсказуемые креденшалы прод-инстанса при ошибке конфигурации; действующий
  дефолтный admin-доступ с интернет-логином до ротации.
compensating_controls:
  - ".env в .gitignore, в git не попадает"
  - "SECRET_KEY прод переопределён (boolean re-check 2026-09-07)"
  - "ufw DENY 8000; наружу только nginx TLS; /reports,/analytics,/admin за ролями"
  - "До ротации действует P0-блок auth/deploy-фаз (RAI-OS-DIR-002)"
owner: Denis
approved_by: Denis
approved_at: "2026-09-07"
expires_at: "2026-09-27"
exit_criteria:
  - "Ротация prod admin подтверждена повторным boolean re-check (RAI-OS-DIR-002)"
  - "Профили dev/prod разведены, прод-старт с dev-дефолтами невозможен (fail-fast) — закрытие CRM-RAI-OS-CHANGE-006"

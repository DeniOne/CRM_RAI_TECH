<div class="space-y-6">
    <div class="text-sm text-muted">
        {{ u.full_name }} · <span class="font-mono">{{ u.email }}</span>
        {% if is_self %}<span class="text-xs">(вы)</span>{% endif %}
    </div>

    <form onsubmit="return submitCredentials(event, {{ u.id }}, 'email')" class="space-y-3">
        <div>
            <label class="block text-xs text-muted mb-1">Логин (email для входа)</label>
            <input type="email" name="email" value="{{ u.email }}" required
                   class="w-full border border-black/10 rounded-lg px-3 py-2 text-sm text-ink focus:outline-none focus:ring-2 focus:ring-ink/20">
            <div class="text-xs text-muted mt-1">
                После смены логина вход — по новому email. Старые ссылки сброса пароля станут недействительными.
            </div>
        </div>
        <button type="submit"
                class="w-full bg-ink text-white py-2 rounded-lg text-sm hover:bg-ink/90">
            Сменить логин
        </button>
    </form>

    <div class="border-t border-black/10"></div>

    <form onsubmit="return submitCredentials(event, {{ u.id }}, 'password')" class="space-y-3">
        <div>
            <label class="block text-xs text-muted mb-1">Новый пароль</label>
            <input type="password" name="password" required minlength="6"
                   class="w-full border border-black/10 rounded-lg px-3 py-2 text-sm text-ink focus:outline-none focus:ring-2 focus:ring-ink/20">
        </div>
        <div>
            <label class="block text-xs text-muted mb-1">Повторите пароль</label>
            <input type="password" name="password_confirm" required minlength="6"
                   class="w-full border border-black/10 rounded-lg px-3 py-2 text-sm text-ink focus:outline-none focus:ring-2 focus:ring-ink/20">
            <div class="text-xs text-muted mt-1">Не короче 6 символов. Сообщите пароль пользователю лично.</div>
        </div>
        <button type="submit"
                class="w-full bg-ink text-white py-2 rounded-lg text-sm hover:bg-ink/90">
            Сменить пароль
        </button>
    </form>
</div>
